name: BigQuery Migration CI/CD

on:
  push:
    branches:
      - main

  workflow_dispatch:
  workflow_dispatch:

jobs:
  validate:
    name: Validate Migration Framework
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python Syntax
        run: |
          python -m py_compile scripts/migrate.py
          python -m py_compile scripts/test_bigquery.py

      - name: Validate Migration Files
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          migrations = sorted(Path("migrations").glob("*.sql"))

          if not migrations:
              raise SystemExit("ERROR: No migration SQL files found")

          for migration in migrations:
              sql = migration.read_text()

              up = re.search(
                  r"(?ims)^\s*--\s*UP\s*$([\s\S]*?)^\s*--\s*DOWN\s*$",
                  sql
              )
              down = re.search(
                  r"(?ims)^\s*--\s*DOWN\s*$([\s\S]*)$",
                  sql
              )

              if not up or not up.group(1).strip():
                  raise SystemExit(
                      f"ERROR: Missing or empty UP section: {migration}"
                  )

              if not down or not down.group(1).strip():
                  raise SystemExit(
                      f"ERROR: Missing or empty DOWN section: {migration}"
                  )

              print(f"VALID: {migration}")

          print(f"Validated {len(migrations)} migration files.")
          PY

  deploy:
    name: Apply BigQuery Migrations
    runs-on: ubuntu-latest
    needs: validate

    if: github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      BQ_DATASET: ${{ vars.BQ_DATASET }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify Google Cloud Authentication
        run: |
          gcloud auth list
          gcloud config set project "$GCP_PROJECT_ID"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Current Migration Status
        run: python scripts/migrate.py --status

      - name: Apply Pending BigQuery Migrations
        run: python scripts/migrate.py