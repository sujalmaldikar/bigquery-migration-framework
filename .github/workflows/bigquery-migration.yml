name: BigQuery Migration CI/CD

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    name: Validate Migration Framework
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Python Syntax
        run: |
          python -m py_compile scripts/migrate.py
          python -m py_compile scripts/test_bigquery.py

      - name: Validate Migration SQL Files
        run: |
          python - <<'PY'
          from pathlib import Path

          migrations = sorted(Path("migrations").glob("*.sql"))

          if not migrations:
              raise SystemExit("ERROR: No migration SQL files found")

          for migration in migrations:
              if not migration.read_text().strip():
                  raise SystemExit(f"ERROR: Empty migration: {migration}")
              print(f"VALID: {migration}")

          print(f"Validated {len(migrations)} migration files.")
          PY

      - name: Validate Rollback SQL Files
        run: |
          python - <<'PY'
          from pathlib import Path

          migrations = sorted(Path("migrations").glob("*.sql"))
          rollback_dir = Path("rollback")

          for migration in migrations:
              rollback = rollback_dir / migration.name

              if not rollback.exists():
                  raise SystemExit(f"ERROR: Missing rollback: {rollback}")

              if not rollback.read_text().strip():
                  raise SystemExit(f"ERROR: Empty rollback: {rollback}")

              print(f"VALID: {rollback}")

          print("Rollback file validation completed.")
          PY

  deploy:
    name: Apply BigQuery Migrations
    runs-on: ubuntu-latest
    needs: validate

    # Only deploy from main, never from pull requests.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'

    permissions:
      contents: read
      id-token: write

    env:
      GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
      BQ_DATASET: ${{ vars.BQ_DATASET }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - name: Setup Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Verify Google Cloud Authentication
        run: |
          gcloud auth list
          gcloud config set project "$GCP_PROJECT_ID"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Current Migration Status
        run: python scripts/migrate.py --status

      - name: Apply Pending BigQuery Migrations
        run: python scripts/migrate.py
